name: Bug report
description: Report reproducible behavior in the collector, scanner, UI, or deployment.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private vulnerability details, or unnecessary observed-host data. Use SECURITY.md for sensitive reports."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe set of steps, logs, or fixtures.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a full commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Go/Node version, and deployment mode where relevant.
